version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gimnasio-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gimnasio_db
    ports:
      - "3307:3306"

  app:
    build: .
    container_name: gimnasio-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gimnasio_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - mysql